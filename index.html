<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<!-- 移动端适配：宽度跟随设备；微信浏览器可正常打开。
     注意：不要加 maximum-scale / user-scalable=no——
     手机 QQ 浏览器与微信 X5 内核对该组合有已知 bug，
     会导致 viewport 失效、页面按桌面宽度渲染后缩得很小。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<title>面部特征标准化测评</title>
<style>
  /* ============================================================
     样式区：简洁学术风，手机端适配（含微信浏览器）
     ============================================================ */
  :root {
    --ink: #1f2733;
    --ink-soft: #4a5568;
    --ink-faint: #8a94a4;
    --line: #d9dee6;
    --line-soft: #e8ecf1;
    --paper: #ffffff;
    --paper-alt: #f4f6f9;
    --accent: #2f4a63;
    --accent-soft: #e4ebf2;
    --self: #2f4a63;
    --norm: #b7883e;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    /* 禁止部分手机浏览器擅自缩放文字，保证字号按设计渲染 */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper-alt);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    font-size: 16px; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 560px; margin: 0 auto; padding: 20px 18px 60px; }

  /* 小屏手机进一步放大可读性 */
  @media (max-width: 380px) {
    body { font-size: 17px; }
    .card { padding: 22px 18px; }
  }

  .masthead { border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
  .masthead h1 { font-size: 19px; margin: 0; letter-spacing: .5px; }
  .masthead .sub { color: var(--ink-faint); font-size: 12px; margin-top: 4px; }

  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; margin-top: 16px;
  }
  .card h2 {
    font-size: 15px; margin: 0 0 14px;
    padding-left: 9px; border-left: 3px solid var(--accent);
  }

  /* ---------- 上传图片 ---------- */
  .uploader {
    border: 1.5px dashed var(--line); border-radius: var(--radius);
    background: var(--paper-alt); min-height: 150px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
  }
  .uploader .placeholder { text-align: center; color: var(--ink-faint); padding: 26px 12px; }
  .uploader .placeholder .ic {
    width: 44px; height: 44px; margin: 0 auto;
    border-radius: 50%; background: #fff; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--accent);
  }
  .uploader .placeholder .t { margin-top: 10px; font-weight: 600; color: var(--ink-soft); }
  .uploader .placeholder .h { font-size: 12px; margin-top: 4px; }
  #previewImg { width: 100%; max-height: 300px; object-fit: contain; display: block; }

  /* ---------- 身份码输入（失焦后格式化为 A-2-5-F-7-9） ---------- */
  .field-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  #codeInput {
    width: 100%; font-size: 23px; letter-spacing: 3px;
    text-align: center; padding: 14px 10px;
    border: 1.5px solid var(--line); border-radius: 10px;
    text-transform: uppercase; font-variant-numeric: tabular-nums;
  }
  #codeInput:focus { outline: none; border-color: var(--accent); }
  .code-hint { font-size: 11px; color: var(--ink-faint); text-align: center; margin-top: 8px; }

  /* ---------- 开始测评按钮（默认灰色禁用） ---------- */
  .btn {
    width: 100%; border: none; font-size: 17px; padding: 15px;
    border-radius: 10px; margin-top: 18px; cursor: pointer;
    background: var(--accent); color: #fff;
    transition: background .2s, color .2s;
  }
  .btn.disabled { background: #cfd6df; color: #fff; }
  .btn:not(.disabled):active { opacity: .88; }

  /* 内联文字提示（替代弹窗，微信里不突兀） */
  .hint {
    margin-top: 10px; text-align: center; font-size: 13px;
    color: #a63d3d; min-height: 20px;
  }

  /* ---------- 等待界面：进度条 + 滚动式打字机 ---------- */
  .wait-card { text-align: left; }
  .progress-track {
    height: 8px; background: var(--line-soft); border-radius: 99px;
    overflow: hidden; margin: 6px 0 4px;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4a6c8c, var(--accent));
    border-radius: 99px;
    transition: width 8s linear; /* 平滑匀速 8 秒走满 */
  }
  .progress-pct { text-align: right; font-size: 12px; color: var(--ink-faint); }
  /* 滚动式打字机：固定高度，文字超出后自动向上滚动 */
  .typer {
    margin-top: 18px; font-size: 14px; color: var(--ink-soft);
    height: 132px;                 /* 约 5 行高度，超出自动滚动 */
    overflow-y: auto;
    font-family: inherit;
    scrollbar-width: none;         /* 隐藏滚动条，更像“日志输出” */
  }
  .typer::-webkit-scrollbar { display: none; }
  .typer .line { min-height: 26px; }
  .typer .cursor {
    display: inline-block; width: 8px; height: 15px;
    background: var(--accent); vertical-align: -2px; margin-left: 2px;
    animation: blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- 报告 ---------- */
  .report-head { display: flex; gap: 16px; align-items: flex-start; }
  .report-photo {
    width: 104px; height: 104px; flex: 0 0 auto;
    border-radius: 10px; object-fit: cover;
    border: 1px solid var(--line); background: var(--paper-alt);
  }
  .overall-score { display: flex; align-items: baseline; gap: 5px; margin-top: 2px; }
  .overall-score .num { font-size: 36px; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .overall-score .max { color: var(--ink-faint); font-size: 14px; }
  .report-id { font-size: 11px; color: var(--ink-faint); margin-top: 4px; word-break: break-all; }
  .radar-wrap { max-width: 430px; margin: 4px auto 0; }
  .legend {
    display: flex; justify-content: center; gap: 20px; margin-top: 8px;
    font-size: 12px; color: var(--ink-soft); flex-wrap: wrap;
  }
  .legend .key { display: inline-block; width: 15px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .legend .key.self { background: var(--self); }
  .legend .key.norm { background: var(--norm); }
  .text-block .headline { font-weight: 700; margin-bottom: 6px; }
  .text-block .body { color: var(--ink-soft); font-size: 14px; text-align: justify; }
  .hidden { display: none !important; }
  .footer-note { margin-top: 22px; color: var(--ink-faint); font-size: 11px; text-align: center; }
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <h1>面部特征标准化测评</h1>
    <div class="sub">面部审美认知研究 · 标准化数据采集</div>
  </header>

  <!-- ============ 信息录入区 ============ -->
  <section id="inputPanel">
    <!-- 身份码在前：输入框靠近页面顶部，软键盘弹起时不会被遮挡 -->
    <div class="card">
      <h2>输入身份码</h2>
      <div class="field-label">请对照纸条依次输入 6 位身份码</div>
      <input type="text" id="codeInput" inputmode="text" autocomplete="off"
             spellcheck="false" placeholder="6 位身份码" />
      <div class="code-hint">仅允许大写字母与数字（完成后自动显示为 X-X-X-X-X-X）</div>
    </div>

    <div class="card">
      <h2>上传图片</h2>
      <div class="uploader" id="uploader">
        <div class="placeholder" id="placeholder">
          <div class="ic">＋</div>
          <div class="t">上传图片</div>
          <div class="h">图片仅在本地浏览器预览，不会上传或保存</div>
        </div>
        <!-- 无 capture 属性：只从相册/文件选择，不调起摄像头 -->
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" class="hidden" />
        <img id="previewImg" class="hidden" alt="面部照片预览" />
      </div>

      <button type="button" class="btn disabled" id="analyzeBtn">开始测评</button>
      <div class="hint" id="hintText"></div>
    </div>
  </section>

  <!-- ============ 等待界面（进度条 + 滚动式打字机） ============ -->
  <section id="loadingPanel" class="card hidden wait-card">
    <h2>分析中</h2>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
    <div class="typer" id="typer"></div>
  </section>

  <!-- ============ 报告区 ============ -->
  <section id="reportPanel" class="hidden">
    <div class="card">
      <h2>测评报告</h2>
      <div class="report-head">
        <img id="reportPhoto" class="report-photo" alt="被试面部照片" />
        <div>
          <div class="overall-score">
            <span class="num" id="overallNum">--</span><span class="max">/ 10</span>
          </div>
          <div class="report-id" id="reportCode"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>五维结构指标 · 常模对照</h2>
      <div class="radar-wrap" id="radarWrap"></div>
      <div class="legend">
        <span><span class="key self"></span>本人测评结果</span>
        <span><span class="key norm"></span>全国同龄大学生平均水平</span>
      </div>
    </div>

    <div class="card">
      <h2>综合评价</h2>
      <div class="text-block">
        <div class="headline" id="reportHeadline"></div>
        <div class="body" id="reportBody"></div>
      </div>
    </div>
  </section>

  <div class="footer-note">本系统为标准化实验研究工具，测评结果仅用于学术研究情境。</div>
</div>

<script>
/* ================================================================
 *  配置区（如需调整实验参数，只改这里即可）
 * ================================================================ */

/* 1) 合法字符集与数值映射
 *    - 数字 2~9 保留原值；
 *    - 字母 A=2、B=3 依次递增；剔除 I、O（数字也不含 0、1）。
 *    数字与字母【各自从 2 开始】：2 与 A 同为 2、3 与 B 同为 3……
 */
const DIGIT_CHARS = "23456789";
const LETTER_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ"; // 已剔除 I、O
const VALID_CHARS = DIGIT_CHARS + LETTER_CHARS;

const CHAR_VALUE = {};
for (let i = 0; i < DIGIT_CHARS.length; i++) CHAR_VALUE[DIGIT_CHARS[i]] = i + 2; // 2→2 ... 9→9
for (let i = 0; i < LETTER_CHARS.length; i++) CHAR_VALUE[LETTER_CHARS[i]] = i + 2; // A→2 ... Z→25

/* 2) 身份码长度 */
const CODE_LENGTH = 6;

/* 3) 分组判定公式：G = 1*Num(C1) + 3*Num(C3) + 5*Num(C5)
 *    下标对应去除横杠后的字符位置（0 基）：C1=0，C3=2，C5=4
 */
const GROUP_WEIGHTS = [
  { pos: 0, w: 1 },  // C1
  { pos: 2, w: 3 },  // C3
  { pos: 4, w: 5 }   // C5
];
const GROUP_THRESHOLD = 126; // G < 126 低分组；G >= 126 高分组

/* 4) 全局校验公式（保留自实验设计，全部 6 位参与）：
 *    Check = 1*C1 + 2*C2 + ... + 6*C6，Check % 7 必须为 0。
 *    与前期发放的纸质编号一一对应；若不再需要可设为 null 关闭。
 */
const CHECK_MOD = 7;
const CHECK_REMAINDER = 0;

/* 5) 五维评价维度（名称与顺序固定，勿改） */
const DIMENSIONS = [
  "面部对称性",
  "五官比例协调性",
  "皮肤质感状态",
  "面部轮廓规整度",
  "五官精致度"
];

/* 6) 全国同龄大学生常模均值（雷达图参考基线，固定） */
const NORM_MEAN = [6.0, 6.1, 5.9, 6.0, 6.0];

/* 7) 两组总体得分区间（从五维均值推导后夹紧到该区间，保留 1 位小数） */
const OVERALL_RANGE = {
  low:  { min: 4.0, max: 5.2 },
  high: { min: 7.8, max: 9.0 }
};

/* 8) 两组五维随机生成规则（详见下方 generateDimensions）
 *    - 高分组：整体高于常模；随机 1~2 个维度明显拔尖，其余略高于或接近常模；
 *    - 低分组：整体低于常模；最多 1 个维度达到常模，其余低于常模。
 */
const HIGH_PEAK = { minAdd: 1.4, maxAdd: 2.2 };  // 高分组拔尖维度：常模 + [1.4, 2.2]
const HIGH_REST = { minAdd: 0.1, maxAdd: 0.8 };  // 高分组其余维度：常模 + [0.1, 0.8]
const LOW_NORM_JITTER = 0.1;                     // 低分组“达到常模”维度的抖动范围
const LOW_BELOW = { minSub: 0.7, maxSub: 1.6 };  // 低分组其余维度：常模 - [0.7, 1.6]
const SCORE_CAP = 9.6;                           // 单维度上限，避免图形顶满

/* 9) 两组预设评价文案 */
const TEXT_BANK = {
  low: {
    headline: "整体表现低于同龄常模，各维度分布均衡",
    body: "综合五项结构指标，本次测评显示该面部样本在面部对称性、五官比例协调性、皮肤质感状态、面部轮廓规整度与五官精致度上的整体表现低于全国同龄大学生常模均值，各维度分布较为均衡，未呈现明显的单一维度优势。需说明的是，面部审美评价具有较强的情境性与个体差异，本报告仅反映样本在当前标准化评价框架下的相对位置。"
  },
  high: {
    headline: "整体表现高于同龄常模，结构协调、发展均衡",
    body: "综合五项结构指标，本次测评显示该面部样本在面部对称性、五官比例协调性、皮肤质感状态、面部轮廓规整度与五官精致度上的整体表现高于全国同龄大学生常模均值，各维度发展均衡，呈现较为协调、规整的面部结构特征。该结果反映该样本在当前标准化评价框架下处于相对优势位置。需说明的是，面部审美评价具有较强的情境性与个体差异，本结果应在标准化情境下审慎解读。"
  }
};

/* 10) 等待界面：逐行打字机文本与随机化加载时长
 *    总时长在 [WAIT_MIN, WAIT_MAX] 之间随机；
 *    进度条前进过程中随机出现微小停顿再继续；
 *    打字机在某 1~2 句话前随机停顿 1~2 秒，更像真实分析过程。
 */
const WAIT_LINES = [
  "正在上传图像文件...",
  "检测面部特征点...",
  "提取面部维度信息",
  "计算面部特征五维指标",
  "生成特征雷达图",
  "综合评估得分",
  "正在生成分析报告..."
];
const WAIT_MIN = 8000;    // 最短加载时长（毫秒）
const WAIT_MAX = 12000;   // 最长加载时长（毫秒）
const PROGRESS_PAUSE = { countMin: 1, countMax: 3, durMin: 400, durMax: 1000 }; // 进度条停顿
const TYPER_PAUSE = { countMin: 1, countMax: 2, durMin: 1000, durMax: 2000 };     // 打字机停顿

/* 11) 提示文案 */
const MSG = {
  noPhoto: "请上传照片后再开始分析",
  badCode: "请输入正确的6位身份码"
};

/* ================================================================
 *  基础工具：确定性随机数（以身份码为种子）
 *    同一身份码永远得到同一组五维数据（刷新、重测不变）；
 *    不同身份码之间各有差异，保证同分组内雷达图形态各不相同。
 * ================================================================ */
function hashString(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================================================================
 *  数学公式区
 * ================================================================ */

function numOf(ch) {
  return Object.prototype.hasOwnProperty.call(CHAR_VALUE, ch) ? CHAR_VALUE[ch] : null;
}

/** 全局校验：Check = Σ (i+1)*Num(Ci)，Check % 7 === 0 */
function checkCode(code) {
  if (CHECK_MOD == null) return true;
  let sum = 0;
  for (let i = 0; i < code.length; i++) sum += (i + 1) * numOf(code[i]);
  return (sum % CHECK_MOD) === CHECK_REMAINDER;
}

/** 分组判定（仅第 1、3、5 位加权）：G < 126 低分组，G >= 126 高分组 */
function calcGroup(code) {
  let g = 0;
  for (const item of GROUP_WEIGHTS) g += item.w * numOf(code[item.pos]);
  return { group: g < GROUP_THRESHOLD ? "low" : "high", g: g };
}

/** 按分组规则生成五维数据（以身份码为种子的确定性随机） */
function generateDimensions(code, group) {
  const rnd = mulberry32(hashString(code + "|dims"));
  const n = DIMENSIONS.length;
  const values = new Array(n).fill(0);

  if (group === "high") {
    // 随机挑 1~2 个维度明显拔尖
    const peakCount = 1 + Math.floor(rnd() * 2); // 1 或 2
    const idx = [0, 1, 2, 3, 4];
    // 洗牌取前 peakCount 个作为拔尖维度
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    const peaks = new Set(idx.slice(0, peakCount));
    for (let i = 0; i < n; i++) {
      const norm = NORM_MEAN[i];
      let v;
      if (peaks.has(i)) {
        v = norm + HIGH_PEAK.minAdd + rnd() * (HIGH_PEAK.maxAdd - HIGH_PEAK.minAdd);
      } else {
        v = norm + HIGH_REST.minAdd + rnd() * (HIGH_REST.maxAdd - HIGH_REST.minAdd);
      }
      values[i] = round1(Math.min(v, SCORE_CAP));
    }
  } else {
    // 最多 1 个维度达到常模水平，其余低于常模
    const allowNormDim = rnd() < 0.5; // 一半概率出现 1 个“达标”维度
    const normIdx = Math.floor(rnd() * n);
    for (let i = 0; i < n; i++) {
      const norm = NORM_MEAN[i];
      let v;
      if (allowNormDim && i === normIdx) {
        v = norm + (rnd() * 2 - 1) * LOW_NORM_JITTER; // 贴近常模
      } else {
        v = norm - (LOW_BELOW.minSub + rnd() * (LOW_BELOW.maxSub - LOW_BELOW.minSub));
      }
      values[i] = round1(Math.max(v, 1.0));
    }
  }
  return values;
}

/** 总体得分：取五维均值做基础，再夹紧到组内固定区间 */
function calcOverall(code, group, dims) {
  const rnd = mulberry32(hashString(code + "|overall"));
  const mean = dims.reduce((a, b) => a + b, 0) / dims.length;
  const range = OVERALL_RANGE[group];
  // 均值向组内区间中心对齐，保留被试间小幅差异
  const center = (range.min + range.max) / 2;
  let v = center + (mean - center) * 0.5 + (rnd() - 0.5) * 0.6;
  v = Math.min(Math.max(v, range.min), range.max);
  return round1(v);
}

function round1(x) { return Math.round(x * 10) / 10; }

/* ================================================================
 *  雷达图（纯 SVG，常模基线 + 本人数据从中心展开动画）
 * ================================================================ */
function buildRadarSVG(selfValues, normValues) {
  const size = 460, cx = size / 2, cy = size / 2, R = 140, levels = 5;
  const n = DIMENSIONS.length, max = 10;

  function angleAt(i) { return -Math.PI / 2 + (i * 2 * Math.PI) / n; }
  function pt(i, ratio) {
    const a = angleAt(i);
    return { x: cx + Math.cos(a) * R * ratio, y: cy + Math.sin(a) * R * ratio };
  }
  function polyStr(values) {
    return values.map((v, i) => {
      const r = Math.max(0, Math.min(1, v / max));
      const p = pt(i, r);
      return p.x.toFixed(1) + "," + p.y.toFixed(1);
    }).join(" ");
  }

  let svg = '<svg viewBox="0 0 ' + size + ' ' + size + '" width="100%" role="img" ' +
            'aria-label="五维面部评价雷达图：本人与大学生常模对照">';

  // 同心网格
  for (let li = 0; li < levels; li++) {
    const ratio = (li + 1) / levels;
    svg += '<polygon points="' + polyStr(new Array(n).fill(ratio * max)) +
           '" fill="none" stroke="#e2e7ee" stroke-width="1"/>';
  }
  // 轴线
  for (let ai = 0; ai < n; ai++) {
    const ap = pt(ai, 1);
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + ap.x.toFixed(1) +
           '" y2="' + ap.y.toFixed(1) + '" stroke="#e2e7ee" stroke-width="1"/>';
  }
  // 常模基线（金色虚线，先出现）
  svg += '<polygon points="' + polyStr(normValues) + '" fill="none" ' +
         'stroke="#b7883e" stroke-width="2" stroke-dasharray="6 4"/>';
  // 本人数据多边形（初始全部在中心，由 JS 动画向外展开）
  svg += '<polygon id="selfPoly" points="' + polyStr(new Array(n).fill(0)) + '" ' +
         'fill="rgba(47,74,99,0.22)" stroke="#2f4a63" stroke-width="2.5" stroke-linejoin="round"/>';
  // 本人数据顶点（同步动画）
  for (let pi = 0; pi < n; pi++) {
    svg += '<circle class="selfDot" data-i="' + pi + '" cx="' + cx + '" cy="' + cy +
           '" r="3.5" fill="#2f4a63"/>';
  }
  // 维度标签
  for (let ti = 0; ti < n; ti++) {
    const lp = pt(ti, 1.22);
    const anchor = Math.abs(lp.x - cx) < 12 ? "middle" : (lp.x > cx ? "start" : "end");
    svg += '<text x="' + lp.x.toFixed(1) + '" y="' + lp.y.toFixed(1) +
           '" text-anchor="' + anchor + '" dominant-baseline="middle" ' +
           'font-size="14" fill="#3a4656">' + DIMENSIONS[ti] + '</text>';
  }
  svg += '</svg>';
  return { svg: svg };
}

/** 雷达图从中心向外展开动画（约 1.2 秒，缓出） */
function animateRadar(selfValues) {
  const poly = document.getElementById("selfPoly");
  if (!poly) return;
  const dots = Array.prototype.slice.call(document.querySelectorAll(".selfDot"));
  const duration = 1200;
  const start = performance.now();
  const size = 460, cx = size / 2, cy = size / 2, R = 140, max = 10;
  const n = selfValues.length;

  function angleAt(i) { return -Math.PI / 2 + (i * 2 * Math.PI) / n; }
  function pt(i, ratio) {
    const a = angleAt(i);
    return { x: cx + Math.cos(a) * R * ratio, y: cy + Math.sin(a) * R * ratio };
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const k = easeOut(t);
    const points = selfValues.map((v, i) => {
      const r = Math.max(0, Math.min(1, (v / max) * k));
      const p = pt(i, r);
      return p.x.toFixed(1) + "," + p.y.toFixed(1);
    }).join(" ");
    poly.setAttribute("points", points);
    dots.forEach((dot, i) => {
      const r = Math.max(0, Math.min(1, (selfValues[i] / max) * k));
      const p = pt(i, r);
      dot.setAttribute("cx", p.x.toFixed(1));
      dot.setAttribute("cy", p.y.toFixed(1));
    });
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ================================================================
 *  页面交互
 * ================================================================ */

const fileInput   = document.getElementById("fileInput");
const uploader    = document.getElementById("uploader");
const placeholder = document.getElementById("placeholder");
const previewImg  = document.getElementById("previewImg");
const codeInput   = document.getElementById("codeInput");
const analyzeBtn  = document.getElementById("analyzeBtn");
const hintText    = document.getElementById("hintText");

const inputPanel   = document.getElementById("inputPanel");
const loadingPanel = document.getElementById("loadingPanel");
const reportPanel  = document.getElementById("reportPanel");

// 当前照片 dataURL：仅存于浏览器内存，不上传、不保存，关闭页面即销毁
let currentPhotoDataURL = "";

/* ---------- 上传图片（仅本地预览） ---------- */
uploader.addEventListener("click", function () { fileInput.click(); });
fileInput.addEventListener("change", function (e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    currentPhotoDataURL = ev.target.result; // 只读进内存
    previewImg.src = currentPhotoDataURL;
    previewImg.classList.remove("hidden");
    placeholder.classList.add("hidden");
    refreshButton();
    clearHint();
  };
  reader.readAsDataURL(file);
});

/* ---------- 身份码输入 ----------
 * 【防抖动设计】输入过程中只做：转大写 + 过滤非法字符 + 限长，
 *   不实时插入分隔横杠（避免光标跳动 / 输入法抖动）。
 * 失去焦点时，再格式化为 A-2-5-F-7-9 展示；
 * 重新聚焦编辑时，还原为无横杠原始字符，继续输入依然流畅。
 * 后台读取统一用 extractRaw()：自动剔除所有横杠，只取原始 6 位字符。
 */
function extractRaw(input) {
  const up = String(input).toUpperCase();
  let raw = "";
  for (let i = 0; i < up.length && raw.length < CODE_LENGTH; i++) {
    if (VALID_CHARS.indexOf(up[i]) !== -1) raw += up[i];
  }
  return raw;
}
function formatWithDash(raw) {
  return raw.split("").join("-"); // A-2-5-F-7-9
}

// 输入中：仅大写 + 过滤 + 限长，不插横杠（无抖动）
codeInput.addEventListener("input", function () {
  codeInput.value = extractRaw(codeInput.value);
  clearHint();
  refreshButton();
});

// 失去焦点：格式化展示为 A-2-5-F-7-9
codeInput.addEventListener("blur", function () {
  const raw = extractRaw(codeInput.value);
  if (raw.length > 0) codeInput.value = formatWithDash(raw);
});

// 重新聚焦：保留已格式化的横杠显示（不自动剥离，修复"横杠消失"）。
// 用户一旦继续输入或删除，input 事件会基于剔除横杠后的原始字符重新整理。
codeInput.addEventListener("focus", function () {
  scrollCodeIntoView();
});

/* ---------- 软键盘遮挡修复（手机适配） ----------
 * 聚焦唤起软键盘后，把输入框滚动到可视区域上方，
 * 类似聊天输入框的定位效果，字符不会被键盘遮挡。
 * 页面允许纵向拉长（shell 底部留白 + scrollBy 补偿）。
 */
function scrollCodeIntoView() {
  // 等待键盘弹出动画（iOS/Android 约 300~350ms）
  setTimeout(ensureInputVisible, 350);
  // 部分机型键盘弹出更慢，再补一次
  setTimeout(ensureInputVisible, 650);
}
function ensureInputVisible() {
  if (document.activeElement !== codeInput) return;
  const vv = window.visualViewport;
  const rect = codeInput.getBoundingClientRect();
  if (vv) {
    // 输入框底缘若低于可视区域（被键盘遮住），向上滚动补偿
    const margin = 24; // 输入框与键盘之间留一点空隙
    const overflow = rect.bottom - (vv.height - margin);
    if (overflow > 0) window.scrollBy({ top: overflow, behavior: "smooth" });
    // 输入框顶缘若被顶出屏幕，也向下回拉
    if (rect.top < 0) window.scrollBy({ top: rect.top - 12, behavior: "smooth" });
  } else {
    // 老内核兜底：直接滚到输入框
    try { codeInput.scrollIntoView({ behavior: "smooth", block: "center" }); }
    catch (e) { codeInput.scrollIntoView(false); }
  }
}
// 微信等内置浏览器键盘弹出只触发 visualViewport 变化，这里持续校正
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", ensureInputVisible);
}

/* ---------- 按钮点亮逻辑：图片 ✔ 且 身份码满 6 位 ✔ ---------- */
function hasPhoto() { return !!currentPhotoDataURL; }
function rawCode() { return extractRaw(codeInput.value); }
function isCodeFull() { return rawCode().length === CODE_LENGTH; }
function refreshButton() {
  if (hasPhoto() && isCodeFull()) analyzeBtn.classList.remove("disabled");
  else analyzeBtn.classList.add("disabled");
}
function showHint(text) { hintText.textContent = text; }
function clearHint() { hintText.textContent = ""; }

/* ---------- 点击【开始测评】 ---------- */
analyzeBtn.addEventListener("click", function () {
  // 双条件校验：缺哪项提示哪项（都不满足时优先提示图片）
  if (!hasPhoto()) { showHint(MSG.noPhoto); return; }
  if (!isCodeFull()) { showHint(MSG.badCode); return; }

  const code = rawCode();
  // 全局校验公式（Check % 7）：编号非法时视为格式错误
  if (!checkCode(code)) { showHint(MSG.badCode); return; }

  // 进入等待界面：进度条 + 打字机（总时长 8~12 秒随机）
  startWaiting(function () {
    const groupResult = calcGroup(code);
    showReport(code, groupResult.group);
  });
});

/* ---------- 等待界面：随机时长进度条（含微停顿）+ 滚动式打字机（含随机停顿） ---------- */
function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startWaiting(done) {
  inputPanel.classList.add("hidden");
  reportPanel.classList.add("hidden");
  loadingPanel.classList.remove("hidden");
  window.scrollTo(0, 0);

  // 本次总时长：8~12 秒之间随机
  const total = WAIT_MIN + Math.random() * (WAIT_MAX - WAIT_MIN);

  /* ---- 进度条：JS 逐帧驱动，前进过程中随机出现微小停顿 ---- */
  const bar = document.getElementById("progressBar");
  const pct = document.getElementById("progressPct");
  bar.style.transition = "none";
  bar.style.width = "0%";
  pct.textContent = "0%";

  // 停顿计划：随机 1~3 个停顿点（进度 15%~90% 之间），每个停 0.4~1 秒
  const pauseCount = randInt(PROGRESS_PAUSE.countMin, PROGRESS_PAUSE.countMax);
  const pauses = [];
  for (let i = 0; i < pauseCount; i++) {
    pauses.push({
      at: 15 + Math.random() * 75, // 触发时的进度百分比
      dur: PROGRESS_PAUSE.durMin + Math.random() * (PROGRESS_PAUSE.durMax - PROGRESS_PAUSE.durMin)
    });
  }
  pauses.sort((a, b) => a.at - b.at);
  const pauseSum = pauses.reduce((s, p) => s + p.dur, 0);
  const speed = 100 / (total - pauseSum); // 前进速度（%/ms），保证恰好在 total 时刻到 100%

  // 由已流逝时间反推当前进度（停顿期间进度冻结）
  function progressAt(elapsed) {
    let effective = elapsed; // 有效前进时间
    let acc = 0;             // 已完成停顿的累计时长
    for (let i = 0; i < pauses.length; i++) {
      const triggerAbs = pauses[i].at / speed + acc; // 该停顿开始的绝对时刻
      if (elapsed < triggerAbs) break;               // 尚未到达该停顿
      if (elapsed < triggerAbs + pauses[i].dur) {
        effective = pauses[i].at / speed;            // 正在停顿：冻结在触发点
        break;
      }
      acc += pauses[i].dur;                          // 该停顿已结束
      effective -= pauses[i].dur;
    }
    return Math.min(100, effective * speed);
  }

  const t0 = performance.now();
  function frame(now) {
    const elapsed = now - t0;
    const p = elapsed >= total ? 100 : progressAt(elapsed);
    bar.style.width = p + "%";
    pct.textContent = Math.floor(p) + "%";
    if (elapsed < total) requestAnimationFrame(frame);
    else { bar.style.width = "100%"; pct.textContent = "100%"; }
  }
  requestAnimationFrame(frame);

  /* ---- 打字机：逐行逐字出现，随机在某 1~2 句话前停顿 1~2 秒 ---- */
  const typer = document.getElementById("typer");
  typer.innerHTML = "";

  // 随机选停顿行（不停在第 1 行之前，避免开场空白）
  const tCount = randInt(TYPER_PAUSE.countMin, TYPER_PAUSE.countMax);
  const candidates = shuffled(Array.from({ length: WAIT_LINES.length - 1 }, (_, i) => i + 1));
  const typerPauses = {};
  let tPauseSum = 0;
  candidates.slice(0, tCount).forEach(function (idx) {
    const d = TYPER_PAUSE.durMin + Math.random() * (TYPER_PAUSE.durMax - TYPER_PAUSE.durMin);
    typerPauses[idx] = d;
    tPauseSum += d;
  });
  // 剩余时间均分给各行打字
  const perLine = (total - tPauseSum) / WAIT_LINES.length;

  function scrollTyper() { typer.scrollTop = typer.scrollHeight; }

  let li = 0;
  function typeLine() {
    if (li >= WAIT_LINES.length) return;
    const idx = li;
    // 命中停顿的行：先停 1~2 秒（光标在上一行末尾闪烁），再开始打
    const delay = typerPauses[idx] || 0;
    setTimeout(beginLine, delay);

    function beginLine() {
      // 去掉上一行末尾的光标
      const oldCursor = typer.querySelector(".cursor");
      if (oldCursor) oldCursor.remove();

      const lineEl = document.createElement("div");
      lineEl.className = "line";
      typer.appendChild(lineEl);
      scrollTyper();

      const text = WAIT_LINES[idx];
      const perChar = Math.max(30, perLine / text.length);
      let ci = 0;
      const cursor = '<span class="cursor"></span>';

      const timer = setInterval(function () {
        ci++;
        lineEl.innerHTML = text.slice(0, ci) + cursor;
        scrollTyper();
        if (ci >= text.length) {
          clearInterval(timer);
          lineEl.innerHTML = text + cursor; // 保留闪烁光标，等待下一行
          li++;
          typeLine();
        }
      }, perChar);
    }
  }
  typeLine();

  // 到达随机总时长后渲染报告
  setTimeout(done, total);
}

/* ---------- 渲染报告（含雷达图展开动画） ---------- */
function showReport(code, groupKey) {
  const dims = generateDimensions(code, groupKey);
  const overall = calcOverall(code, groupKey, dims);
  const text = TEXT_BANK[groupKey];

  document.getElementById("reportPhoto").src = currentPhotoDataURL;
  document.getElementById("overallNum").textContent = overall.toFixed(1);
  document.getElementById("reportCode").textContent = "编号：" + code;
  document.getElementById("reportHeadline").textContent = text.headline;
  document.getElementById("reportBody").textContent = text.body;

  document.getElementById("radarWrap").innerHTML =
    buildRadarSVG(dims, NORM_MEAN).svg;

  loadingPanel.classList.add("hidden");
  inputPanel.classList.add("hidden");
  reportPanel.classList.remove("hidden");
  window.scrollTo(0, 0);

  // 从中心向外展开绘制雷达图
  animateRadar(dims);
}
